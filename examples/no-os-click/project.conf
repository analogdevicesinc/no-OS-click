# Enable the UART interface. The demo prints on the console UART.
CONFIG_UART=y

# Enable the Click socket buses. The Click drivers talk over SPI or I2C.
CONFIG_SPI=y
CONFIG_I2C=y

# Enable GPIO. The ISO ADC 2 Click wires the AD7091R CONVST to the socket RST.
CONFIG_GPIO=y
