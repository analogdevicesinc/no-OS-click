name: no_os_click_iio
type: application
version: "0.9.0"
description: "CAPI application serving the Click boards' parts to libiio clients"

capi_version_requirement: ">=0.9.0"

# Each key under depends.platform is a value of PLATFORM in a preset.
# A build resolves only the platform that its preset selects.
# The environment variable CAPI_<PLATFORM>_DIR overrides the checkout, and
# <NAME>_DIR a package's.
depends:
  platform:
    alif: {git: "https://github.com/analogdevicesinc/capi-alif.git", checkout: main}
  packages:
    - libiio: {version: ">=1.0.0", git: "https://github.com/CioRadu1/libiio.git", checkout: capi-port-without-capi-value, subdir: capi}
    # What the Alif platform is built on, at the versions its board files
    # are made for.
    - alif_ensemble-cmsis-dfp: {git: "https://github.com/alifsemi/alif_ensemble-cmsis-dfp.git", checkout: v2.2.1}
    - CMSIS_6: {git: "https://github.com/ARM-software/CMSIS_6.git", checkout: v6.4.0}
